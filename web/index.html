<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container">
        <!-- Close Button -->
        <div class="close-btn" onclick="close_jarvis()">&#10006;</div>

        <!-- The Main Glowing Siri-like Orb -->
        <div class="orb" onclick="wake_jarvis()">
            <div class="orb-core"></div>
        </div>

        <!-- Status Text in the Center -->
        <div class="status-center">
            <h1 id="status-text">JARVIS</h1>
            <p id="sub-text">Standby</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
